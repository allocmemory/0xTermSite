<a class="logo" href="{{ config.base_url | safe }}/" aria-label="0xTerm home">
<svg class="logo-svg" viewBox="0 0 160 160" aria-hidden="true">
  <defs>
    <linearGradient id="oxt-bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset=".2" stop-color="#cdd3d9"/>
      <stop offset=".47" stop-color="#8f989f"/>
      <stop offset=".5" stop-color="#5c656d"/>
      <stop offset=".53" stop-color="#aab3ba"/>
      <stop offset=".82" stop-color="#e8ecef"/>
      <stop offset="1" stop-color="#7a838b"/>
    </linearGradient>
    <linearGradient id="oxt-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2428"/>
      <stop offset="1" stop-color="#0f1214"/>
    </linearGradient>
    <linearGradient id="oxt-glyph" x1="0" y1="36.5" x2="0" y2="73.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".46" stop-color="#d3d9de"/>
      <stop offset=".5" stop-color="#7f888f"/>
      <stop offset=".56" stop-color="#e2e6e9"/>
      <stop offset="1" stop-color="#9ba4ab"/>
    </linearGradient>
  </defs>
  <path fill="url(#oxt-bezel)" fill-rule="evenodd" d="M42 8H118A34 34 0 0 1 152 42V118A34 34 0 0 1 118 152H42A34 34 0 0 1 8 118V42A34 34 0 0 1 42 8ZM44 20A24 24 0 0 0 20 44V116A24 24 0 0 0 44 140H116A24 24 0 0 0 140 116V44A24 24 0 0 0 116 20Z"/>
  <rect x="20" y="20" width="120" height="120" rx="24" fill="url(#oxt-screen)"/>
  <g fill="none" stroke="url(#oxt-glyph)" stroke-width="6.5" stroke-linecap="round">
    <rect x="35" y="36.5" width="22" height="37" rx="11"/>
    <path d="M42 64 50 46" stroke-width="5.2"/>
    <path d="M64 46.5 84 73.5M84 46.5 64 73.5"/>
  </g>
  <rect x="90" y="36.5" width="17" height="37" rx="1.5" fill="#6f7880"/>
</svg>
<canvas class="logo-gpu" aria-hidden="true"></canvas>
</a>
<script>
/* The logo is drawn by a fragment shader: signed distance fields for the
   bezel, the 0x glyphs and the cursor become a height field, its normals
   reflect a chrome environment, and the light follows the pointer. The SVG
   underneath stays visible until the GPU has drawn its first frame. */
(() => {
  const wrap = document.currentScript.previousElementSibling;
  const cv = wrap.querySelector("canvas");
  let gl;
  try { gl = cv.getContext("webgl", { alpha: true, premultipliedAlpha: true, antialias: false }); } catch (e) {}
  if (!gl) return;

  const vs = `attribute vec2 a; varying vec2 uv; void main(){ uv = a * .5 + .5; gl_Position = vec4(a, 0., 1.); }`;
  const fs = `precision highp float;
varying vec2 uv;
uniform float uPx, uTime;
uniform vec2 uLight;

float box(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
float seg(vec2 p, vec2 a, vec2 b){ vec2 pa = p - a, ba = b - a; return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0., 1.)); }

float dOuter(vec2 p){ return box(p - 80., vec2(72.), 34.); }
float dScreen(vec2 p){ return box(p - 80., vec2(60.), 24.); }
float dBezel(vec2 p){ return max(dOuter(p), -dScreen(p)); }
float dGlyph(vec2 p){
  float z = abs(box(p - vec2(46., 55.), vec2(11., 18.5), 11.)) - 3.25;
  z = min(z, seg(p, vec2(42., 64.), vec2(50., 46.)) - 2.6);
  float x = min(seg(p, vec2(64., 46.5), vec2(84., 73.5)), seg(p, vec2(84., 46.5), vec2(64., 73.5))) - 3.25;
  return min(z, x);
}
float dCursor(vec2 p){ return box(p - vec2(98.5, 55.), vec2(8.5, 18.5), 1.5); }

/* Rounded bevel: a quarter circle of radius w rising from each edge. */
float bevel(float d, float w){ float t = 1. - clamp(-d / w, 0., 1.); return w * sqrt(1. - t * t); }
float height(vec2 p){
  return max(bevel(dBezel(p), 6.), max(bevel(dGlyph(p), 3.25), .45 * bevel(dCursor(p), 2.)));
}

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}

/* Chrome reflects a studio: bright sky, a hard dark horizon, a grey floor.
   The light turns and tilts the studio, so the horizon slides over the metal. */
vec3 env(vec3 r){
  float a = -uLight.x * .7;
  vec2 xy = mat2(cos(a), -sin(a), sin(a), cos(a)) * r.xy;
  float y = xy.y - uLight.y * .35 + .06 * sin(xy.x * 4. + uTime * .3);
  vec3 sky = mix(vec3(.62, .67, .72), vec3(1.), smoothstep(.05, .75, y));
  vec3 floor_ = mix(vec3(.16, .18, .2), vec3(.52, .55, .58), smoothstep(-.9, -.05, y));
  return mix(floor_, sky, smoothstep(-.015, .015, y));
}

void main(){
  vec2 p = vec2(uv.x, 1. - uv.y) * 160.;
  float e = .35;
  vec2 g = vec2(height(p + vec2(e, 0.)) - height(p - vec2(e, 0.)), height(p + vec2(0., e)) - height(p - vec2(0., e))) / (2. * e);
  vec3 n = normalize(vec3(-g.x, g.y, 1.));
  vec3 r = reflect(vec3(0., 0., -1.), n);
  vec3 L = normalize(vec3(uLight, .9));
  float spec = pow(max(dot(n, normalize(L + vec3(0., 0., 1.))), 0.), 70.);
  vec3 chrome = env(r) + spec * 1.1;
  chrome *= mix(.72, 1., n.z);

  float dB = dBezel(p), dG = dGlyph(p), dC = dCursor(p), dS = dScreen(p);

  vec3 screen = mix(vec3(.118, .141, .157), vec3(.059, .071, .078), p.y / 160.);
  screen *= 1. - .45 * smoothstep(5., 0., -dS);
  screen *= 1. - .35 * smoothstep(3.5, 0., min(dG, dC));
  float sheen = smoothstep(.0, .5, 1. - abs(p.x + p.y - 140. - uLight.x * 50.) / 70.);
  screen += vec3(.035) * sheen;

  vec3 bezel = chrome * vec3(.93, .96, 1.) + (noise(vec2(p.x * .09, p.y * 3.)) - .5) * .05;
  vec3 glyph = chrome * 1.04;
  vec3 cursor = chrome * .42 + .07;

  float px = uPx;
  float aG = clamp(.5 - dG / px, 0., 1.);
  float aC = clamp(.5 - dC / px, 0., 1.);
  float aB = clamp(.5 - dB / px, 0., 1.);
  vec3 col = screen;
  col = mix(col, cursor, aC);
  col = mix(col, glyph, aG);
  col = mix(col, bezel, aB);
  float alpha = clamp(.5 - dOuter(p) / px, 0., 1.);
  gl_FragColor = vec4(col * alpha, alpha);
}`;

  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null; };
  const v = sh(gl.VERTEX_SHADER, vs), f = sh(gl.FRAGMENT_SHADER, fs);
  if (!v || !f) return;
  const prog = gl.createProgram();
  gl.attachShader(prog, v); gl.attachShader(prog, f); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
  gl.useProgram(prog);

  // One triangle that covers the whole canvas.
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(prog, "a");
  gl.enableVertexAttribArray(a);
  gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  const uPx = gl.getUniformLocation(prog, "uPx"), uTime = gl.getUniformLocation(prog, "uTime"), uLight = gl.getUniformLocation(prog, "uLight");

  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let tx = -.45, ty = .6, lx = tx, ly = ty, moved = -1e9, onScreen = true, raf = 0;

  const draw = (t) => {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const w = Math.max(1, Math.round(cv.clientWidth * dpr));
    if (cv.width !== w || cv.height !== w) { cv.width = cv.height = w; }
    gl.viewport(0, 0, w, w);
    gl.uniform1f(uPx, 160 / w);
    gl.uniform1f(uTime, t);
    gl.uniform2f(uLight, lx, ly);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!wrap.classList.contains("gpu")) wrap.classList.add("gpu");
  };

  if (still) { draw(0); return; }

  const clamp = (x) => Math.max(-1, Math.min(1, x));
  addEventListener("pointermove", (ev) => {
    const r = cv.getBoundingClientRect();
    tx = clamp((ev.clientX - (r.left + r.width / 2)) / innerWidth * 2.4);
    ty = clamp(-(ev.clientY - (r.top + r.height / 2)) / innerHeight * 2.4);
    moved = performance.now();
  }, { passive: true });

  const frame = (now) => {
    const t = now / 1000;
    // After a few idle seconds the light drifts on its own.
    if (now - moved > 2500) { tx = Math.cos(t * .45) * .75; ty = .35 + Math.sin(t * .3) * .45; }
    lx += (tx - lx) * .06; ly += (ty - ly) * .06;
    draw(t);
    raf = requestAnimationFrame(frame);
  };
  const run = () => { if (!raf && onScreen && !document.hidden) raf = requestAnimationFrame(frame); };
  const stop = () => { cancelAnimationFrame(raf); raf = 0; };
  document.addEventListener("visibilitychange", () => (document.hidden ? stop() : run()));
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(([en]) => { onScreen = en.isIntersecting; onScreen ? run() : stop(); }).observe(cv);
  }
  run();
})();
</script>
